x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mbs:change-me@postgres:5432/mbs}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["uvicorn", "mbs.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro

  celery-worker:
    <<: *app
    command: ["celery", "-A", "mbs.celery_app", "worker", "--loglevel=info"]

  celery-beat:
    <<: *app
    command: ["celery", "-A", "mbs.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbs}
      POSTGRES_USER: ${POSTGRES_USER:-mbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
