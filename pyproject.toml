[project]
name = "mbs"
version = "0.1.0"
description = "Market Business System (MBS) v3.3"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.142.1",
    "ImageHash>=4.3",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=5.0.0.93",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13.1",
    "pytest-playwright>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"support/review_receipts.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "pytesseract", "pytesseract.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mbs.receipts.pdf_extraction"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "tests.test_receipt_pdf_extraction",
    "test_receipt_pdf_extraction",
    "tests.test_receipt_pipeline_wiring",
    "test_receipt_pipeline_wiring",
    "tests.test_receipt_review_ui",
    "test_receipt_review_ui",
]
disallow_untyped_calls = false
